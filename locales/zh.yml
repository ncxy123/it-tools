  campus-timetable:
    title: 课表冲突检测与空闲时段计算
    description: 粘贴教务系统的课表即可批量导入，自动按周次检测时间冲突，算出每周的空闲时段，还能一键导出手机日历。
  gpa-calculator:
    title: 绩点 / 加权平均分换算
    description: 内置多套绩点算法可一键切换，支持百分制、五级制、字母等级混合录入，并能反推目标绩点还差多少分。

  password-strength-analyser:
