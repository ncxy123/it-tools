    whyTitle: 这个工具为什么更好用
    why1: 内置多套常见绩点算法，一键切换对比 —— 保研、留学、评奖学金口径各不相同，同一张成绩单能算出不同结果。
    why2: 百分制、五级制、字母等级可以混合录入 —— 原始成绩单怎么写就怎么录，不用自己先心算换算一遍。
    why3: 能反推目标绩点 —— 想知道「剩下的课平均要考多少分才能到 3.5」，这里直接给答案。
    why4: 选修课、体育课能一键排除 —— 大多数在线绩点计算器做不到按课程逐条勾选是否计入。
    why5: 数据只存在本地浏览器，成绩单不会离开你的电脑。
    scale:
      standard40:
        name: 通用 4.0 制（十段法）
        note: 国内多数高校与北美申请最常用的分段换算
      pku40:
        name: 北大 4.0 制（五分段）
        note: 区间更宽，85+ 即为 3.7，对高分段更友好
      strict40:
        name: 严格 4.0 制
        note: 只有 90 分以上才记满绩，多数 985 院校采用
      linear50:
        name: 线性折算（成绩−50）/10
        note: 部分院校教务处使用的连续公式，无分段跳变
      fivePoint:
        name: 五分制
        note: 按 90/80/70/60 分段记 5.0–1.0 绩点
      fourFive:
        name: 4.5 制（八段法）
        note: 常见于部分理工科院校
      custom:
        name: 自定义规则
        note: 按「最低分:绩点」逐行填写，适配本校教务处口径
    mode:
      auto:
        label: 自动识别
        hint: 数字、优秀 / 良好 / 中等、A+ A- B+ 混在一张表里也能认
      percent:
        label: 百分制
        hint: 直接输入 0–100 的数字
      level5:
        label: 五级制
        hint: 优秀 / 良好 / 中等 / 及格 / 不及格
      letter:
        label: 字母等级
        hint: A+ A A- B+ B B- C+ C C- D F

