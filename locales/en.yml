    whyTitle: Why this tool is easier to use
    why1: Paste a whole term of classes at once instead of clicking cell by cell — the timetable text from your academic system is parsed as-is.
    why2: Conflicts are judged by week, not just by period — two courses that alternate between odd and even weeks are not reported as a clash.
