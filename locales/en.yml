    targetHint: The projection assumes an even credit distribution for the remaining courses.
    importFormat: One course per line, in the order course name, credits, score, separated by a space, comma or pipe.
    importPlaceholder: Copy your transcript from the academic system and paste it here
    importAppend: Append
    importReplace: Replace existing data
    importNothing: No courses recognised — please check the format
    imported: 'Imported {n} grades'
    importErrors: '{n} lines could not be parsed'
    importErrorLine: 'Line {line}: '
    whyTitle: Why this tool is easier to use
    why1: Several common GPA scales are built in and can be switched with one click — graduate admission, study abroad and scholarships all use different rules, so the same transcript gives different numbers.
    why2: Percentage, five-level and letter grades can be mixed — enter scores exactly as they appear on your transcript instead of converting them by hand.
    why3: It works backwards from your target GPA — if you want to know what you need on the remaining courses to reach 3.5, the answer is right here.
    why4: Electives and PE can be excluded with a single click — most online GPA calculators cannot toggle courses individually.
    why5: Data stays in your local browser, so your transcript never leaves your computer.
    scale:
      standard40:
        name: Standard 4.0 (ten bands)
        note: The most common band conversion in Chinese universities and North American applications
      pku40:
        name: PKU 4.0 (five bands)
        note: Wider bands — 85 and above already earns 3.7, friendlier to high scores
      strict40:
        name: Strict 4.0
        note: Only 90 and above earns a full 4.0, used by many top-tier universities
      linear50:
        name: Linear (score − 50) / 10
        note: A continuous formula used by some registrars, with no band jumps
      fivePoint:
        name: Five-point
        note: Bands at 90/80/70/60 mapped to 5.0–1.0
      fourFive:
        name: 4.5 scale (eight bands)
        note: Common in some science and engineering universities
      custom:
        name: Custom rules
        note: 'Fill in one "minimum score: points" per line to match your own registrar'
    mode:
      auto:
        label: Auto-detect
        hint: Numbers, Excellent / Good / Fair and A+ A- B+ can all be mixed in one table
      percent:
        label: Percentage
        hint: Enter a number between 0 and 100
      level5:
        label: Five-level
        hint: Excellent / Good / Fair / Pass / Fail
      letter:
        label: Letter grade
        hint: A+ A A- B+ B B- C+ C C- D F

